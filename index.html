<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCE000">
<title>Подключение ресторана — Яндекс Еда</title>
<style>:root{
  --bg:#F5F4F2;--card:#fff;--ink:#21201F;--mute:#77746F;--line:#E8E6E2;
  --accent:#FCE000;--accent-soft:#FFF7BF;--gray:rgba(92,90,87,.1);
  --ok:#029154;--ok-soft:#E5F5EC;--err:#E35539;--err-soft:#FDECE8;--warn:#B7791F;--warn-soft:#FFF4DC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "YS Text","YandexSansText","Yandex Sans Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg{flex:none}

/* шапка */
.top{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 1px 0 rgba(33,32,31,.07)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:-2px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.grow{flex:1}
.tabs-main{max-width:1320px;margin:0 auto;padding:0 20px 10px;display:flex;gap:10px}
.tab{flex:1;display:flex;align-items:center;gap:12px;border:0;background:var(--gray);border-radius:16px;padding:10px 16px;cursor:pointer;text-align:left;transition:.15s}
.tab:hover{background:rgba(92,90,87,.17)}
.tab.on{background:var(--ink);color:#fff}
.tab .tn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.tab b{display:block;font-size:15px}
.tab small{display:block;font-size:12.5px;opacity:.75}

/* кнопки */
.btn{border:0;background:var(--gray);border-radius:16px;padding:11px 18px;font-weight:500;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;color:var(--ink)}
.btn:hover{background:rgba(92,90,87,.17)}
.btn.primary{background:var(--accent)}
.btn.primary:hover{background:#F0D500}
.btn.sm{padding:8px 14px;min-height:38px;border-radius:12px;font-size:13.5px}
.btn.ghost{background:transparent}.btn.ghost:hover{background:var(--gray)}
.btn.danger{color:var(--err)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* страница */
.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 120px}
.panel{background:#fff;border-radius:24px}
.page{display:block}
#pMenu{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
#pMenu.hidden{display:none}
.card{background:#fff;border-radius:24px;padding:24px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.4px}
.card .lead{color:var(--mute);margin:0 0 16px;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
label.f{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
label.f em{color:var(--err);font-style:normal;margin-left:2px}
label.f .n{color:var(--mute);font-weight:400;margin-right:4px}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=time],select,textarea{width:100%;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:12px 14px;outline:none;transition:.15s}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--accent)}
.bad{border-color:var(--err)!important;background:#FFF6F3!important}
.help{font-size:12.5px;color:var(--mute);margin-top:5px}
.msg{font-size:12.5px;margin-top:5px}
.msg.err{color:var(--err)}.msg.warn{color:var(--warn)}.msg.ok{color:var(--ok)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline>input,.inline>select{flex:1;min-width:0}
.mini{font-size:12px;color:var(--mute)}
.pill{border:0;background:var(--gray);border-radius:100px;padding:6px 14px;font-weight:500;cursor:pointer;font-size:13px}
.pill:hover{background:var(--accent-soft)}

/* график */
.sched{display:flex;flex-direction:column;gap:6px}
.day{display:grid;grid-template-columns:150px 120px 1fr;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 12px}
.day b{font-weight:500}
.day .tm{display:flex;gap:8px;align-items:center}
.day .tm input{background:#fff;padding:9px 10px}
.day.off .tm{opacity:.35;pointer-events:none}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13.5px}
.sw input{width:18px;height:18px;accent-color:#21201F}

/* файлы */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.fl{background:var(--bg);border-radius:18px;padding:8px;position:relative}
.fl .im{aspect-ratio:4/3;border-radius:12px;background:#fff center/cover no-repeat}
.fl .nm{font-size:12px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .x{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer;font-weight:700}
.drop{border:2px dashed #D9D6D0;border-radius:18px;padding:18px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/* меню */
.side{position:sticky;top:150px;max-height:calc(100vh - 260px);display:flex;flex-direction:column;overflow:hidden}
.side-h{padding:16px 16px 10px}
.side-h .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.list{overflow:auto;flex:1;padding-bottom:8px}
.grp{font-size:12px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:12px 20px 4px}
.item{display:flex;gap:10px;margin:2px 8px;border-radius:16px;padding:10px 12px;cursor:pointer;align-items:center}
.item:hover{background:var(--bg)}
.item.sel{background:var(--accent-soft)}
.item .th{width:44px;height:33px;border-radius:8px;background:var(--bg) center/cover no-repeat;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12.5px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#D6D4CB}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.editor{padding:24px}
.ed-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ed-head h2{margin:0;flex:1;font-size:24px;letter-spacing:-.4px}
.back{display:none}
.photo{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
.photo .im{aspect-ratio:4/3;border-radius:16px;background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:10px}
.taxbox{background:var(--bg);border-radius:16px;padding:12px 14px}
.taxbox input{background:#fff}

/* нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;box-shadow:0 -10px 30px rgba(33,32,31,.08)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0}
.prog .tx{font-size:13px;margin-bottom:5px}
.pbar{height:6px;background:var(--gray);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--ok);width:0;transition:.3s}
.fab{display:none}

/* окна */
.modal{position:fixed;inset:0;background:rgba(33,32,31,.5);z-index:60;display:grid;place-items:center;padding:20px}
.mbox{background:#fff;border-radius:28px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px}
.mbox h3{margin:0 0 6px;font-size:20px;letter-spacing:-.3px}
.mbox textarea{min-height:200px;font-size:13.5px}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.prob{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.prob:hover{background:var(--bg)}
.prob b{min-width:120px;color:var(--mute);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:16px;z-index:80;font-size:14px;max-width:92vw;text-align:center}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:90;display:grid;place-items:center;font-weight:500}

/* планшет и телефон */
@media(max-width:980px){#pMenu{grid-template-columns:1fr}.side{position:static;max-height:none}.list{overflow:visible}}
@media(max-width:760px){
  html,body{font-size:16px}
  .top{position:sticky}
  .top-in{padding:8px 12px}
  .brand small{display:none}
  .btn .lb{display:none}
  .top .btn{padding:10px 12px}
  .tabs-main{padding:0 12px 8px;gap:8px}
  .tab{padding:8px 10px;gap:8px}
  .tab b{font-size:14px}
  .wrap{padding:10px 10px calc(100px + env(safe-area-inset-bottom))}
  .card{padding:18px 14px;border-radius:20px}
  .c8,.c6,.c4,.c3{grid-column:span 12}
  input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=time],select,textarea{font-size:16px}
  .day{grid-template-columns:1fr auto;row-gap:6px}
  .day .tm{grid-column:1/-1}
  .photo{grid-template-columns:1fr}
  body.m-edit #pMenu .side{display:none}
  body:not(.m-edit) #pMenu .editor{display:none}
  body.on-menu:not(.m-edit) .fab{display:grid}
  .fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:45;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.28);place-items:center;cursor:pointer}
  .back{display:inline-flex}
  .editor{padding:16px 14px}
  .ed-head h2{font-size:19px}
  .bar-in{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .prog .tx{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #saveSt{display:none}
  .modal{place-items:end center;padding:0}
  .mbox{border-radius:22px 22px 0 0;max-height:92vh;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .mrow .btn{flex:1;justify-content:center}
  .prob{flex-direction:column;gap:2px}
}

.msg a{color:inherit;word-break:break-all}
.msg .btn{min-height:32px;padding:5px 12px}

.dnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}
.dnav .r{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
@media(max-width:760px){.dnav,.dnav .r{width:100%}.dnav .btn{flex:1 1 100%;justify-content:center}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;background:var(--gray);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.chip:hover{background:rgba(92,90,87,.17)}
.chip.on{background:var(--accent);font-weight:500}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M12 3v3M8 4.5l1 2M16 4.5l-1 2"/></svg></div><div>Подключение ресторана<small>Яндекс Еда</small></div></div>
  <div class="grow"></div>
  <button class="btn primary" id="bExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="lb">Скачать архив</span></button>
</div>
<nav class="tabs-main" id="tabs">
  <button class="tab on" data-tab="info"><span class="tn">1</span><span><b>Основная информация</b><small id="tInfo"></small></span></button>
  <button class="tab" data-tab="menu"><span class="tn">2</span><span><b>Меню</b><small id="tMenu"></small></span></button>
</nav></header>

<main class="wrap">
  <section id="pInfo" class="page"></section>
  <section id="pMenu" class="page hidden">
    <aside class="panel side">
      <div class="side-h">
        <input type="text" id="search" placeholder="Поиск блюда">
        <div class="row"><button class="btn sm primary" id="bAdd">+ Новое блюдо</button><button class="btn sm" id="bPaste">Вставить список</button></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="panel editor" id="editor"></section>
  </section>
</main>

<button class="fab" id="fab" aria-label="Новое блюдо">+</button>
<div class="bar"><div class="bar-in">
  <div class="prog"><div class="tx" id="progTx"></div><div class="pbar"><i id="progFill"></i></div><div class="mini" id="saveSt"></div></div>
  <button class="btn primary" id="bExport2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Скачать архив</button>
</div></div>

<script>(function(){
'use strict';
/* ================= справочники ================= */
const CITIES = ['Ташкент','Чирчик','Кибрай','Ангрен','Алмалык','Янгиюль','Фергана','Андижан','Маргилан','Коканд','Наманган','Джизак','Карши','Шахрисабз','Самарканд','Навои','Бухара','Хорезм','Ургенч','Нукус'];
const TYPES = ['Ресторан','Кафе','Фастфуд','Кофейня','Пекарня','Кондитерская','Чайхана','Столовая','Бар','Пиццерия','Суши-бар','Шаурма / донер','Кухня только на доставку'];
const CUISINES = ['Узбекская','Национальная','Европейская','Итальянская','Японская','Корейская','Китайская','Паназиатская','Турецкая','Грузинская','Русская','Американская','Восточная','Индийская','Мексиканская','Фастфуд','Морепродукты','Вегетарианская','Десерты и выпечка','Кофе и напитки','Смешанная'];
const CATS = [
 ['Салаты','10202001003000000'],['Роллы','10202001006000003'],['Горячие блюда прочие','10202001006000007'],['Горячие блюда с мясом','10202001006000001'],
 ['Горячие блюда из круп, макарон и овощей','10202001006000004'],['Горячие блюда с рыбой','10202001006000003'],['Горячие блюда мучные','10202001006000005'],
 ['Супы','10202001004000000'],['Соусы, гарниры, добавки','10202001007000001'],['Хлеб','10202001005000001'],['Закуски','10202001001000005'],['Фастфуд','10202001002000000'],
 ['Напитки','02202002001000000'],['Кофе и кофейные напитки','10202001010000002'],['Завтраки','10202001009000001'],['Десерты','10202001008000003'],['Чай','10202001010000001'],
 ['Компоты, лимонады и прочие напитки','10202001010000003'],['Энергетики','02202003001000000'],['Контейнеры','10202002005000001'],['Палочки для еды','04419001016000000'],
 ['Приборы','08215001026000000'],['Одноразовая посуда','10202002005000002']
];
const CAT_TAX = Object.fromEntries(CATS);
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DSH = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const UNITS = ['г','мл','кг','л','шт'];
const COOK = ['10','15','20','25','30','40','45','60'];
const PHOTO = {dish:{w:800,h:600,label:'фото блюда'}, cover:{w:1600,h:1200,label:'обложка'}};
const MAXB = 25 * 1024 * 1024;
const LS = 'ye_rest_v1';
/* строки листа «Основная информация» — тексты слово в слово как в шаблоне */
const TPL = ['1 Название ресторана:','2 Тип заведения:','3 Основной тип кухни:','4 Город: (выбор из доступных городов)','5 Адрес(а):','6 График работы заведения с понедельника по воскресенье на доставку:','7 Максимальное время приготовления одного заказа:','8 Контактное лицо владельца ресторана (ФИО):','9 Контактное лицо директора ресторана (ФИО)','10 Телефон директора ресторана:','11 Эл. почта директора ресторана:','12 Телефон для срочных вопросов по заказам (2 номера):','13 Номер Бухгалтерии:','14 Эл. почта бухгалтерии','15 Реквизиты: ','15,1 ИНН/ ПИНФЛ','15,2 ИНН/ ПИНФЛГувахнома ( файл png, jpg)','15,3 МФО банка','15,4 Рассчетный счет','16 Фото оффлайн Меню ','17 Регистрационный код налогоплательщика'];

/* ================= утилиты ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const digits = s => String(s||'').replace(/\D/g,'');
function toast(t, ms=2800){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), ms); }
const MOB = () => matchMedia('(max-width:760px)').matches;
const TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya',ў:'o',қ:'q',ғ:'g',ҳ:'h'};
const slug = t => String(t||'').toLowerCase().replace(/[а-яёўқғҳ]/g, c => TR[c]||'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'foto';
const fmtPhone = s => { let d = digits(s); if (d.length === 9) d = '998' + d; return d.length === 12 && d.startsWith('998') ? `+998 ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}` : s; };
const phoneOK = s => { let d = digits(s); if (d.length === 9) d = '998' + d; return d.length === 12 && d.startsWith('998'); };
const emailOK = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s||'').trim());

/* ================= хранилище файлов (IndexedDB) ================= */
const IDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open('ye_rest_files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('f','readwrite'); t.objectStore('f').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('f').objectStore('f').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async del(k){ const db = await this.open(); return new Promise(res => { const t = db.transaction('f','readwrite'); t.objectStore('f').delete(k); t.oncomplete = res; t.onerror = res; }); }
};
const URLS = {};

/* ================= фото: проверка, перевод в JPG, обрезка ================= */
function loadImg(blob){ return new Promise((res, rej) => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => res({im, u}); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Не получилось открыть файл как изображение')); }; im.src = u; }); }
function canvasJpg(im, sx, sy, sw, sh, w, h, q){ const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(im, sx, sy, sw, sh, 0, 0, w, h); return new Promise(r => c.toBlob(r, 'image/jpeg', q || .9)); }
/* kind: dish | cover | doc | menu */
async function takePhoto(file, kind){
  const {im, u} = await loadImg(file); URL.revokeObjectURL(u);
  let w = im.naturalWidth, h = im.naturalHeight, blob = file;
  const isJpg = /jpe?g/i.test(file.type) || /\.jpe?g$/i.test(file.name);
  const keepPng = kind === 'doc' && /png/i.test(file.type);
  if ((!isJpg && !keepPng) || file.size > MAXB){
    let k = 1, b;
    do { b = await canvasJpg(im, 0, 0, w, h, Math.round(w*k), Math.round(h*k), .9); k *= .8; } while (b && b.size > MAXB && k > .2);
    blob = b; w = Math.round(w*k/.8); h = Math.round(h*k/.8);
  }
  const f = {key: uid(), name: file.name, w, h, size: blob.size, type: blob.type || 'image/jpeg', err:'', warn:''};
  const spec = PHOTO[kind];
  if (spec){
    if (w <= h) f.err = 'Нужно горизонтальное фото';
    else if (w < spec.w || h < spec.h) f.err = `Слишком маленькое: ${w}×${h}, нужно не меньше ${spec.w}×${spec.h}`;
    else if (Math.abs(w/h - 4/3) > .03) f.warn = `Пропорции ${w}×${h} — лучше 4:3, можно обрезать`;
  }
  await IDB.put(f.key, blob);
  return f;
}
async function cropTo43(f, kind){
  const b = await IDB.get(f.key); if (!b) return f;
  const {im, u} = await loadImg(b); URL.revokeObjectURL(u);
  const w = im.naturalWidth, h = im.naturalHeight; let cw = w, ch = Math.round(w*3/4);
  if (ch > h){ ch = h; cw = Math.round(h*4/3); }
  const out = await canvasJpg(im, Math.round((w-cw)/2), Math.round((h-ch)/2), cw, ch, cw, ch, .92);
  await IDB.del(f.key); delete URLS[f.key];
  const g = Object.assign({}, f, {key: uid(), w: cw, h: ch, size: out.size, type:'image/jpeg', err:'', warn:''});
  const spec = PHOTO[kind]; if (spec && (cw < spec.w || ch < spec.h)) g.err = `После обрезки ${cw}×${ch} — меньше ${spec.w}×${spec.h}, нужно фото крупнее`;
  await IDB.put(g.key, out); return g;
}

/* одно постоянное поле в документе: «оторванное» поле браузер мог удалить до выбора файла, и второй выбор не срабатывал */
const pickFiles = (multi, accept) => new Promise(res => {

/* ================= фото в интернет: postimages.org → прямая ссылка (как в инструкции по заполнению) ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function postUpload(blob, fname){
  const fd = new FormData(); fd.append('file', blob, fname); fd.append('gallery',''); fd.append('optsize','0'); fd.append('expire','0'); fd.append('numfiles','1'); fd.append('upload_session', uid() + Date.now());
  const r = await fetch('https://postimages.org/json/rr', {method:'POST', body:fd, headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}});
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.url) throw new Error((j && j.error && j.error.message) || ('сервис не принял файл (' + r.status + ')'));
  return j.url;
}
let lastRelay = 0;
async function directFromPage(pageUrl){
  for (let k = 0; k < 4; k++){
    const wait = Math.max(0, lastRelay + 3200 - Date.now()); if (wait) await sleep(wait); lastRelay = Date.now();
    try {
      const r = await fetch('https://r.jina.ai/' + pageUrl, {headers:{'X-Return-Format':'html'}});
      if (r.ok){ const t = await r.text(), h = t.match(/data-hotlink="([^"]+)"/), n = t.match(/data-name="([^"]+)"/), e = t.match(/data-ext="([^"]+)"/); if (h && n && e) return 'https://i.postimg.cc/' + h[1] + '/' + n[1] + '.' + e[1]; }
    } catch(e){}
    await sleep(1500 * (k + 1));
  }
  throw new Error('не удалось получить прямую ссылку');
}
const UPQ = []; let upBusy = false;
function queueUpload(f){ if (!f || !f.key || f.url || f.state === 'queued' || f.state === 'uploading') return; f.state = 'queued'; f.uerr = ''; UPQ.push(f); runUploads(); }
async function runUploads(){
  if (upBusy) return; upBusy = true;
  while (UPQ.length){
    const f = UPQ.shift(); if (f.url || !findPhoto(f.key)) continue;   /* фото уже заменили или удалили */
    f.state = 'uploading'; photosChanged();
    try {
      const b = await IDB.get(f.key); if (!b) throw new Error('файл не найден на устройстве');
      if (!f.page) f.page = await postUpload(b, 'eda-' + slug(String(f.name).replace(/\.[^.]+$/,'')) + '-' + uid().slice(0,4) + '.jpg');
      f.url = await directFromPage(f.page); f.state = 'ok';
    } catch(e){ f.state = 'err'; f.uerr = e.message || 'ошибка сети'; }
    save(); photosChanged();
  }
  upBusy = false; photosChanged();
}

function refreshDish(){

function addDish(o){ const d = blankDish(o); S.dishes.push(d); S.sel = d.id; save(); renderMenu(); showEditor(); if (!MOB()) setTimeout(() => { const s = $('[data-d="cat"]'); s && s.focus(); }, 50); }

      const im = new Image(); let done = false;

  $('#bExport2').innerHTML = (info ? '' : ic) + lb + (info ? ' ' + IC_NEXT : '');
}
function ctaClick(){ if (S.tab !== 'menu'){ setTab('menu'); if (!S.dishes.length) addDish(); } else exportNow(false); }
function renderBar(){
  const s = stats();
  $('#tInfo').textContent = `заполнено ${s.infoDone} из ${s.infoAll}`;
  $('#tMenu').textContent = s.dishes ? `${s.dishes} блюд · готово ${s.dishOK}` : 'блюд пока нет';
  const total = s.infoAll + Math.max(s.dishes, 1), done = s.infoDone + s.dishOK;
  $('#progTx').innerHTML = `Анкета: <b>${s.infoDone}</b> из ${s.infoAll} · Меню: <b>${s.dishOK}</b> из ${s.dishes} блюд готово`;
  $('#progFill').style.width = Math.round(100 * done / total) + '%';
}
function busy(on){ let b = $('.busy'); if (on && !b){ b = document.createElement('div'); b.className = 'busy'; b.textContent = 'Обрабатываем фото…'; document.body.appendChild(b); } else if (!on && b) b.remove(); }

/* ================= выгрузка: архив = Excel по шаблону + фото и документы ================= */
const crcT = (() => { const t = []; for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files, mime){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  const u16 = n => [n&255,(n>>8)&255], u32 = n => [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for (const [name, str] of files){
    const nb = enc.encode(name), data = (typeof str === 'string') ? enc.encode(str) : str, crc = crc32(data);
    const lh = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)]);
    parts.push(lh, nb, data);
    cd.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += lh.length + nb.length + data.length;
  }
  const cdLen = cd.reduce((a,b) => a + b.length, 0);
  const end = new Uint8Array([0x50,0x4b,5,6, 0,0,0,0, ...u16(files.length), ...u16(files.length), ...u32(cdLen), ...u32(off), 0,0]);
  return new Blob([...parts, ...cd, end], {type: mime || 'application/zip'});
}
const X = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const col = i => String.fromCharCode(65 + i);
function sheetXml(rows, widths, styleOf, frozen){
  const cell = (r, c, v, s) => { if (v === '' || v == null) return ''; if (typeof v === 'number') return `<c r="${col(c)}${r}" s="${s}"><v>${v}</v></c>`; return `<c r="${col(c)}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`; };
  const sd = rows.map((row, ri) => `<row r="${ri+1}">` + row.map((v, ci) => cell(ri+1, ci, v, styleOf(ri, ci, v))).join('') + `</row>`).join('');
  const cols = widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${frozen?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':''}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>${cols}</cols><sheetData>${sd}</sheetData></worksheet>`;
}
function buildXlsx(info, menu){
  /* стили: 0 обычный, 1 вопрос, 2 ответ (текст), 3 шапка меню (чёрная), 4 текст, 5 число */
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="12"/><name val="Calibri"/></font><font><sz val="13"/><name val="Helvetica Neue"/></font><font><b/><sz val="12"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF000000"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="49" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const s1 = sheetXml(info, [79, 62.7], (r, c) => c === 0 ? 1 : 2, false);
  const s2 = sheetXml(menu, [24, 34, 17, 20.2, 60.7, 50, 30.3], (r, c, v) => r === 0 ? 3 : (typeof v === 'number' ? 5 : 4), true);
  const ct = 'application/vnd.openxmlformats-officedocument.spreadsheetml';
  return zip([
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="${ct}.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="${ct}.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="${ct}.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="${ct}.styles+xml"/></Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Основаня информация" sheetId="1" r:id="rId1"/><sheet name="Меню" sheetId="2" r:id="rId2"/></sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', styles], ['xl/worksheets/sheet1.xml', s1], ['xl/worksheets/sheet2.xml', s2]
  ], ct + '.sheet');
}
const ext = f => /png/i.test(f.type) ? 'png' : 'jpg';
const safe = s => String(s||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60) || 'ресторан';
async function exportNow(force){
  if (upBusy || UPQ.length){ busy(true); $('.busy').textContent = 'Дожидаемся загрузки фото…'; const t0 = Date.now(); while ((upBusy || UPQ.length) && Date.now() - t0 < 90000) await sleep(500); busy(false); }
  const s = stats();
  const probs = [], noLink = f => f && f.key && !f.url && !f.err;
  Object.entries(s.ie).forEach(([k, m]) => probs.push({tab:'info', k, where:'Основная информация', what:(INFO.find(f => f.k === k)||{}).t + ': ' + m}));
  S.dishes.filter(d => !dishEmpty(d)).forEach(d => { const e = dishErrors(d); const ks = Object.keys(e); if (ks.length) probs.push({tab:'menu', id:d.id, where:'Меню · ' + (d.name || 'без названия'), what: ks.map(k => e[k]).join('; ')}); });
  if (!s.dishes) probs.push({tab:'menu', where:'Меню', what:'Не добавлено ни одного блюда'});
  if (noLink(S.info.cover)) probs.push({tab:'info', k:'cover', where:'Основная информация', what:'Фото обложки не выложено в интернет — нажмите «Повторить» под фото'});
  if (S.info.menuPh.some(noLink)) probs.push({tab:'info', k:'menuPh', where:'Основная информация', what:'Не все фото офлайн-меню выложены в интернет — нажмите «Повторить» под фото'});
  S.dishes.filter(d => !dishEmpty(d) && noLink(d.photo) && d.photo.state !== 'err').forEach(d => probs.push({tab:'menu', id:d.id, where:'Меню · ' + (d.name || 'без названия'), what:'Фото ещё выкладывается в интернет — подождите и скачайте снова'}));
  if (probs.length && !force){
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox"><h3>Нужно доработать: ${probs.length}</h3><p class="mini" style="margin:0 0 10px">Нажмите на строку — откроем нужное место. Архив можно скачать и сейчас, но анкету с пропусками могут вернуть на доработку.</p><div>${probs.slice(0,60).map((p,n) => `<div class="prob" data-n="${n}"><b>${esc(p.where)}</b><span>${esc(p.what)}</span></div>`).join('')}</div><div class="mrow"><button class="btn" id="eAny">Скачать всё равно</button><button class="btn primary" id="eFix">Исправить</button></div></div>`;
    document.body.appendChild(m);
    m.onclick = e => { if (e.target === m) m.remove(); const r = e.target.closest('.prob'); if (r){ const p = probs[+r.dataset.n]; m.remove(); S.showAll = true; if (p.tab === 'menu'){ setTab('menu'); if (p.id){ S.sel = p.id; renderMenu(); showEditor(); } } else { setTab('info'); refreshInfo(); setTimeout(() => { const el = $(`[data-m="${p.k}"]`); el && el.scrollIntoView({block:'center'}); }, 60); } } };
    $('#eFix').onclick = () => { m.remove(); S.showAll = true; const p = probs[0]; if (p.tab === 'menu'){ setTab('menu'); if (p.id){ S.sel = p.id; renderMenu(); showEditor(); } } else { setTab('info'); refreshInfo(); } };
    $('#eAny').onclick = () => { m.remove(); exportNow(true); };
    return;
  }
  busy(true); $('.busy').textContent = 'Собираем архив…';
  try {
    const i = S.info, files = [], enc = async (path, f) => { if (!f.key) return f.url || ''; const b = await IDB.get(f.key); if (b) files.push([path, new Uint8Array(await b.arrayBuffer())]); return f.url || path; };
    const guv = i.guv ? await enc('документы/гувахнома.' + ext(i.guv), i.guv) : '';
    const menu = []; for (let n = 0; n < i.menuPh.length; n++) menu.push(await enc(`офлайн_меню/меню_${n+1}.${ext(i.menuPh[n])}`, i.menuPh[n]));
    const cover = i.cover ? await enc('обложка.' + ext(i.cover), i.cover) : '';
    const sched = i.sched.map((d,n) => `${DSH[n]}: ${d.on ? (d.from === '00:00' && d.to === '23:59' ? 'круглосуточно' : d.from + '–' + d.to) : 'выходной'}`).join('; ');
    const ans = [i.name, i.type, i.cuisine, i.city, i.addresses.map(a => a.trim()).filter(Boolean).join('; '), sched, i.cook ? i.cook + ' мин' : '', i.owner, i.director, fmtPhone(i.dirPhone), i.dirEmail, [i.urg1, i.urg2].filter(Boolean).map(fmtPhone).join(', '), fmtPhone(i.accPhone), i.accEmail, '', digits(i.inn), guv, digits(i.mfo), digits(i.account), menu.join(', '), String(i.regCode||'').trim()];
    const infoRows = TPL.map((q, n) => [q, n === 0 ? (ans[0] || 'Ответы ') : ans[n]]);
    infoRows.push(['18 Фото обложки ресторана (1600×1200)', cover]);
    const mrows = [['Категория','Блюдо','Вес','Цена','Ингредиенты','Фото','ИКПУ']];
    const ds = S.dishes.filter(d => !dishEmpty(d));
    for (let n = 0; n < ds.length; n++){
      const d = ds[n]; const ph = d.photo ? await enc(`фото_блюд/${String(n+1).padStart(3,'0')}_${slug(d.name)}.jpg`, d.photo) : '';
      const pr = +digits(d.price);
      mrows.push([d.cat, d.name.trim(), d.weight ? String(d.weight).replace('.',',') + ' ' + d.wunit : '', pr > 0 ? pr : '', d.ingr.trim().replace(/\s+/g,' '), ph, String(d.tax||'').trim()]);
    }
    const x = buildXlsx(infoRows, mrows);
    const name = safe(i.name);
    files.unshift([`${name} — шаблон меню Yandex Eats.xlsx`, new Uint8Array(await x.arrayBuffer())]);
    const blob = zip(files);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}_Яндекс_Еда_${new Date().toISOString().slice(0,10)}.zip`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('Архив скачан — отправьте его менеджеру Яндекс Еды');
  } catch(err){ console.error(err); toast('Не получилось собрать архив: ' + err.message); }
  busy(false);
}

/* ================= запуск ================= */
function init(){
  try { const d = JSON.parse(localStorage.getItem(LS) || 'null'); if (d){ S.info = Object.assign(blankInfo(), d.info || {}); S.dishes = (d.dishes || []).map(x => blankDish(x)); S.tab = d.tab || 'info'; if (S.dishes.length) S.sel = S.dishes[0].id; } } catch(e){}
  $$('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('#bExport').onclick = ctaClick; $('#bExport2').onclick = ctaClick;
  bindInfo(); bindMenu();
  renderInfo(); setTab(S.tab);
  if (S.info.guv) S.info.guv.noUpload = true;
  allPhotos().forEach(f => { if (f.key && !f.url){ f.state = ''; queueUpload(f); } if (!f.key && /^Проверяем/.test(f.warn || '')) f.warn = 'Картинка по ссылке не проверена — откройте ссылку в браузере и убедитесь, что она ведёт прямо на файл .jpg'; });
  window.addEventListener('resize', debounce(() => { if (!MOB()) document.body.classList.remove('m-edit'); }, 200));
}
window.YR = {S, stats, infoErrors, dishErrors, buildXlsx, exportNow, takePhoto, IDB, setTab};
document.addEventListener('DOMContentLoaded', init);
})();
